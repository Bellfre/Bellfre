[project]
name = "bellfre"
version = "0.9b.0"
description = "Bellfre Agent Tag infrastructure"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.45.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bellfre"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.pyright]
extraPaths = [
    "examples/helloworld"
]