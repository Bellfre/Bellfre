manifest:
  version: "1.0"

agent:

  # Permanent Bellfre Unique Identifier
  bui: "1.301.0304.B42.001"

  # Registered publisher identifier
  publisher_slug: "B42"

  publisher:
    name: "Bellfre"

  product: "Calculator"

  name: "Bellfre Calculator"

  version: "0.1.0"

  description: >
    A capability-based agent that performs deterministic
    mathematical calculations and can be extended with
    reasoning capabilities.

runtime:

  language: "python"

  protocol: "a2a"

endpoint:

  # Local development endpoint
  url: "http://localhost:8000"

capabilities:

  - id: arithmetic.calculate

    type: deterministic

    description: >
      Performs mathematical calculations using local
      execution without requiring an LLM.

    implementation:
      module: "capabilities.calculator.calculator"

  - id: mathematics.explain

    type: reasoning

    description: >
      Provides mathematical explanations, concepts,
      and historical context using reasoning capability.

    implementation:
      module: "capabilities.reasoning.reasoning"

execution:

  entrypoint: "run.py"